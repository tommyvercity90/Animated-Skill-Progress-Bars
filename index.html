
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Skill Bars</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <section class="skills-section" id="skills">
        <div class="container">
            <p class="subtitle">WHAT I KNOW</p>
            <h1>My Skills</h1>
            <p class="description">
                Here are some of my technical skills and proficiency levels.
            </p>

            <div class="skills-list">

                <div class="skill">
                    <div class="skill-info">
                        <span>HTML</span>
                        <span class="percentage">90%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-bar html"
                             data-progress="90"></div>
                    </div>
                </div>

                <div class="skill">
                    <div class="skill-info">
                        <span>CSS</span>
                        <span class="percentage">85%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-bar css"
                             data-progress="85"></div>
                    </div>
                </div>

                <div class="skill">
                    <div class="skill-info">
                        <span>JavaScript</span>
                        <span class="percentage">75%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-bar javascript"
                             data-progress="75"></div>
                    </div>
                </div>

                <div class="skill">
                    <div class="skill-info">
                        <span>Responsive Design</span>
                        <span class="percentage">80%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-bar responsive"
                             data-progress="80"></div>
                    </div>
                </div>

                <div class="skill">
                    <div class="skill-info">
                        <span>Git & GitHub</span>
                        <span class="percentage">65%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-bar git"
                             data-progress="65"></div>
                    </div>
                </div>

            </div>
        </div>
    </section>

</body>
</html>
